<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="El Scorcho"
    >

    <meta name="theme-color" content="#101010">

    <title>EL Scorcho </title>

    <!-- Favicon -->
    <link
        rel="icon"
        type="image/png"
        href="images/favicon.png"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet"
    >

    <!-- Main styles -->
    <link
        rel="stylesheet"
        href="notebook/main.css"
    >

    <link
        rel="stylesheet"
        href="notebook/scrapbook.css"
    >

    <link
        rel="stylesheet"
        href="notebook/comments.css"
    >

    <link
        rel="stylesheet"
        href="notebook/animations.css"
    >
</head>

<body>

    <!-- ==================================================
         BACKGROUND DECORATIONS
    =================================================== -->

    <div
        class="background-doodles"
        aria-hidden="true"
    >
        <span class="star">★</span>
        <span class="heart">♥</span>
        <span class="music">♪</span>
        <span class="star2">✦</span>
    </div>

    <!-- ==================================================
         PAGE WRAPPER
    =================================================== -->

    <main
        id="top"
        class="page-shell"
    >

        <div class="content-layout">

            <!-- ==========================================
                 MAIN CONTENT
            =========================================== -->

            <div class="main-column">

                <!-- ======================================
                     SCRAPBOOK INTRO
                ======================================= -->

                <section
                    class="scrapbook-intro paper-panel"
                    aria-labelledby="page-heading"
                >
                    <div
                        class="paper-tape paper-tape-left"
                        aria-hidden="true"
                    ></div>

                    <div
                        class="paper-tape paper-tape-right"
                        aria-hidden="true"
                    ></div>

                    <p class="handwritten-note">
                        play this one loud
                    </p>

                    <h1 id="page-heading">
                        El Scorcho
                    </h1>

                    <p class="intro-copy">
                        El Scorcho
                    </p>
                </section>


                <!-- ======================================
                     VIDEO SECTION
                ======================================= -->

                <section
                    class="video-section"
                    aria-labelledby="video-title"
                >

                    <div class="video-frame">

                        <!--
                            player.js replaces this element
                            with the YouTube iframe player.
                        -->

                        <div id="youtube-player"></div>

                    </div>


                    <!-- Optional custom progress display -->

                    <div class="video-progress-panel">

                        <div class="video-time-row">
                            <span id="video-current-time">
                                0:00
                            </span>

                            <span id="video-duration">
                                0:00
                            </span>
                        </div>

                        <input
                            id="video-progress"
                            class="video-progress"
                            type="range"
                            min="0"
                            max="1000"
                            value="0"
                            aria-label="Video progress"
                        >

                    </div>

                </section>


                <!-- ======================================
                     VIDEO INFORMATION
                ======================================= -->

                <section class="video-info paper-panel">

                    <div
                        class="paper-tape"
                        aria-hidden="true"
                    ></div>

                    <h2
                        id="video-title"
                        class="video-title"
                    >
                        El Scorcho
                    </h2>

                    <p
                        id="video-channel"
                        class="video-channel"
                    >
                        Weezer
                    </p>

                    </div>

                </section>

    <!-- ==================================================
         VIDEO FEED DATA
    =================================================== -->

    <script>
        window.EL_SCORCHO_VIDEOS = [
            {
                id: "okthJIVbi6g",
                title: "El Scorcho",
                channel: "Weezer",
                duration: "4:04",
                views: "12M views",
                age: "8 years ago",
                thumbnail:
                    "https://img.youtube.com/vi/okthJIVbi6g/hqdefault.jpg",
                note: "the main event",
                badge: "classic"
            }
        ];
    </script>


    <!-- ==================================================
         JAVASCRIPT MODULES

         index.html is inside the elscorcho folder,
         so paths are relative to this folder.
    =================================================== -->

    <script src="mixtapes/save.js"></script>
    <script src="mixtapes/upgrades.js"></script>
    <script src="mixtapes/player.js"></script>
    <script src="mixtapes/feed.js"></script>
    <script src="mixtapes/shop.js"></script>
    <script src="mixtapes/comments.js"></script>
    <script src="mixtapes/ui.js"></script>
    <script src="mixtapes/main.js"></script>

</body>
</html>
