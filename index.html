<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>El Scorcho</title>

    <link rel="icon" href="favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Caveat:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="notebook/main.css">
    <link rel="stylesheet" href="notebook/scrapbook.css">
    <link rel="stylesheet" href="notebook/sidebar.css">
    <link rel="stylesheet" href="notebook/shop.css">
    <link rel="stylesheet" href="notebook/comments.css">
    <link rel="stylesheet" href="notebook/animations.css">

</head>

<body>

<div class="background-doodles">
    <span class="star">★</span>
    <span class="heart">♡</span>
    <span class="music">♪</span>
    <span class="star2">☆</span>
</div>

<header class="topbar">

    <div class="logo">

        <h1>EL SCORCHO</h1>

        <p>Pinkerton • 1996</p>

    </div>

    <div class="sticky-note">

        NOW PLAYING

    </div>

</header>

<div class="layout">

    <main class="content">

        <div class="draw-link">

            <a href="draw.html">

                ✏ Draw Weezer From Memory

            </a>

        </div>

        <section class="video-section">

            <div class="video-frame">

                <div id="player"></div>

                <div id="loader"></div>

                <button id="sound-hint">

                    🔇 Click for Sound

                </button>

            </div>

        </section>

        <section class="video-info">

            <h2 id="main-title">

                El Scorcho

            </h2>

            <div id="points-hud"></div>

            <div id="channel-row"></div>

            <div id="action-row"></div>

            <div id="description-box"></div>

        </section>

        <section class="comments">

            <h2 id="comments-header">

                Comments

            </h2>

            <div id="comment-input-area"></div>

            <div id="comments-list"></div>

        </section>

    </main>

    <aside class="sidebar">

        <h2>

            Up Next

        </h2>

        <div id="feed"></div>

    </aside>

</div>

<div id="shop-backdrop">

    <div id="shop-modal">

        <div id="shop-header"></div>

        <div id="shop-items"></div>

        <div id="shop-multiplier"></div>

        <div id="shop-extras"></div>

        <div id="shop-rebirth"></div>

    </div>

</div>

<div id="admin-panel"></div>

<script src="https://www.youtube.com/iframe_api"></script>

<script src="mixtapes/save.js"></script>
<script src="mixtapes/player.js"></script>
<script src="mixtapes/feed.js"></script>
<script src="mixtapes/shop.js"></script>
<script src="mixtapes/comments.js"></script>
<script src="mixtapes/upgrades.js"></script>
<script src="mixtapes/ui.js"></script>
<script src="mixtapes/main.js"></script>

</body>

</html>
